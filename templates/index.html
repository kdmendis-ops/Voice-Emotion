<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Are You Feeling?</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Nunito', 'Comic Sans MS', cursive, sans-serif;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 28px;
      padding: 40px 32px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }

    .greeting {
      font-size: 26px;
      font-weight: 800;
      color: #4a3f6b;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 15px;
      color: #8a7faa;
      margin-bottom: 32px;
      font-weight: 600;
    }

    /* ── Record button area ── */
    .record-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 0 auto 20px;
    }

    .pulse-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 4px solid #FF6B6B;
      opacity: 0;
      pointer-events: none;
    }

    .pulse-ring.active {
      animation: pulse 1s ease-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    #recordBtn {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #FF6B6B, #ee5a24);
      color: #fff;
      font-size: 52px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(238, 90, 36, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #recordBtn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 12px 32px rgba(238, 90, 36, 0.5);
    }

    #recordBtn:active:not(:disabled) {
      transform: scale(0.97);
    }

    #recordBtn.recording {
      background: linear-gradient(145deg, #c0392b, #922b21);
      box-shadow: 0 8px 24px rgba(192, 57, 43, 0.5);
      animation: glow 1s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { box-shadow: 0 8px 24px rgba(192, 57, 43, 0.4); }
      to   { box-shadow: 0 8px 40px rgba(192, 57, 43, 0.8); }
    }

    #recordBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #countdown {
      font-size: 22px;
      font-weight: 800;
      color: #4a3f6b;
      margin-top: 12px;
      min-height: 32px;
      letter-spacing: 1px;
    }

    /* ── Status / loading message ── */
    #statusMsg {
      font-size: 15px;
      color: #8a7faa;
      font-weight: 600;
      min-height: 22px;
      margin-bottom: 8px;
    }

    /* ── Emotion display ── */
    #emotionDisplay {
      margin: 16px 0 8px;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .emoji-big { font-size: 64px; line-height: 1; }

    .emotion-label {
      font-size: 18px;
      font-weight: 700;
      color: #4a3f6b;
      margin-top: 6px;
      text-transform: capitalize;
    }

    /* ── Gemini response card ── */
    #responseArea {
      background: #fffbea;
      border-radius: 16px;
      padding: 18px 20px;
      margin-top: 12px;
      font-size: 16px;
      line-height: 1.7;
      color: #5a4d2a;
      font-weight: 600;
      display: none;
      text-align: left;
    }

    /* ── Try again button ── */
    #tryAgainBtn {
      display: none;
      margin-top: 20px;
      background: linear-gradient(145deg, #6c5ce7, #a29bfe);
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 16px rgba(108, 92, 231, 0.4);
      transition: transform 0.15s ease;
    }

    #tryAgainBtn:hover { transform: scale(1.04); }

    /* ── Error message ── */
    #errorMsg {
      color: #c0392b;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="greeting">How are you feeling today? 😊</h1>
    <p class="subtitle">Press the button and tell me!</p>

    <div class="record-wrap">
      <div class="pulse-ring" id="pulseRing"></div>
      <button id="recordBtn" title="Tap to record">🎤</button>
    </div>

    <div id="countdown"></div>
    <div id="statusMsg">Tap the button to start!</div>
    <div id="errorMsg"></div>

    <div id="emotionDisplay"></div>
    <div id="responseArea"></div>
    <button id="tryAgainBtn">🎤 Try Again</button>
  </div>

  <input type="hidden" id="sessionId" value="{{ session_id }}">

  <script>
    const EMOTION_EMOJI = {
      joy:      "😄",
      sadness:  "😢",
      anger:    "😠",
      fear:     "😨",
      surprise: "😲",
      disgust:  "🤢",
      neutral:  "😐",
    };

    const RECORD_DURATION = 5;

    const recordBtn    = document.getElementById("recordBtn");
    const pulseRing    = document.getElementById("pulseRing");
    const countdownEl  = document.getElementById("countdown");
    const statusMsg    = document.getElementById("statusMsg");
    const errorMsg     = document.getElementById("errorMsg");
    const emotionDisp  = document.getElementById("emotionDisplay");
    const responseArea = document.getElementById("responseArea");
    const tryAgainBtn  = document.getElementById("tryAgainBtn");
    const sessionId    = document.getElementById("sessionId").value;

    let mediaRecorder = null;
    let audioChunks   = [];
    let recording     = false;

    recordBtn.addEventListener("click", startRecording);
    tryAgainBtn.addEventListener("click", resetUI);

    async function startRecording() {
      if (recording) return;
      errorMsg.textContent = "";

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch {
        errorMsg.textContent = "We couldn't access your microphone. Please ask your teacher for help.";
        return;
      }

      recording = true;
      audioChunks = [];

      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : "audio/webm";

      mediaRecorder = new MediaRecorder(stream, { mimeType });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        sendAudio();
      };

      mediaRecorder.start(100);
      recordBtn.classList.add("recording");
      pulseRing.classList.add("active");
      recordBtn.disabled = true;
      tryAgainBtn.style.display = "none";
      responseArea.style.display = "none";
      emotionDisp.innerHTML = "";

      startCountdown(RECORD_DURATION);
    }

    function startCountdown(seconds) {
      let remaining = seconds;
      countdownEl.textContent = remaining;
      statusMsg.textContent   = "Listening... 🎧";

      const interval = setInterval(() => {
        remaining--;
        if (remaining > 0) {
          countdownEl.textContent = remaining;
        } else {
          clearInterval(interval);
          countdownEl.textContent = "✓";
          statusMsg.textContent   = "Got it! Thinking... 🤔";
          recordBtn.classList.remove("recording");
          pulseRing.classList.remove("active");
          mediaRecorder.stop();
          recording = false;
        }
      }, 1000);
    }

    async function sendAudio() {
      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const formData = new FormData();
      formData.append("audio", blob, "checkin.webm");
      formData.append("session_id", sessionId);

      try {
        const res = await fetch("/check-in", { method: "POST", body: formData });
        const data = await res.json();

        if (data.error) {
          errorMsg.textContent = "Something went wrong — please try again!";
          countdownEl.textContent = "";
          statusMsg.textContent = "Tap the button to try again.";
          recordBtn.disabled = false;
          return;
        }

        showResult(data);
      } catch {
        errorMsg.textContent = "Couldn't reach the server — please try again!";
        recordBtn.disabled = false;
        statusMsg.textContent = "Tap the button to try again.";
      }
    }

    function showResult(data) {
      countdownEl.textContent = "";
      statusMsg.textContent   = "";

      const emoji = EMOTION_EMOJI[data.emotion] || "💭";
      emotionDisp.innerHTML = `
        <span class="emoji-big">${emoji}</span>
        <span class="emotion-label">${data.emotion}</span>
      `;

      responseArea.textContent = data.response;
      responseArea.style.display = "block";

      tryAgainBtn.style.display = "inline-block";
    }

    function resetUI() {
      countdownEl.textContent    = "";
      statusMsg.textContent      = "Tap the button to start!";
      errorMsg.textContent       = "";
      emotionDisp.innerHTML      = "";
      responseArea.style.display = "none";
      tryAgainBtn.style.display  = "none";
      recordBtn.disabled         = false;
    }
  </script>
</body>
</html>
